
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="A responsive To-Do Dashboard for creating, organising, and tracking daily tasks.">

    <title>Liberty's ToDo Dashboard</title>

    <!-- Link external CSS and JavaScript files -->
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <!-- SIDEBAR AND NAVIGATION -->
   

    <aside class="sidebar">
        <h1>ToDo</h1>

        <nav aria-label="Main navigation">
            <a class="nav-link active" href="#" aria-current="page">
                Dashboard
            </a>
        </nav>
    </aside>

<!-- MAIN DASHBOARD CONTENT -->


    <main class="main-content">

        <!-- Dashboard breadcrumb -->
        <header class="top-header">
            <nav class="breadcrumb" aria-label="Breadcrumb">
                <span aria-hidden="true">☷</span>
                <span aria-hidden="true">&gt;</span>
                <span>Dashboard</span>
                <span aria-hidden="true">&gt;</span>
                <span>Overview</span>
            </nav>
        </header>


        <!-- Dashboard heading and action button -->
        <section class="page-heading">
            <div>
                <h2>Dashboard Overview</h2>
                <p>Manage and track your daily tasks</p>
            </div>

            <button type="button" id="new-task-button">
                + New Task
            </button>
        </section>


        <!-- NEW TASK FORM -->

        <section
            class="task-form-container"
            id="task-form-container"
            aria-label="Task form"
            hidden
        >
            <h3>Create a New Task</h3>

            <form id="task-form">

                <!-- Task title -->
                <label for="task-title">Task Title</label>
                <input
                    type="text"
                    id="task-title"
                    placeholder="Enter task title"
                    required
                >

                <!-- Task description -->
                <label for="task-description">Description</label>
                <textarea
                    id="task-description"
                    placeholder="Describe the task"
                ></textarea>

                <!-- Task due date -->
                <label for="task-date">Due Date</label>
                <input
                    type="date"
                    id="task-date"
                    required
                >

                <!-- Task priority -->
                <label for="task-priority">Task Priority</label>
                <select id="task-priority" required>
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                </select>

                <!-- Form action buttons -->
                <button type="submit">
                    Save Task
                </button>

                <button type="button" id="cancel-task-button">
                    Cancel
                </button>

            </form>
        </section>


       <!-- SEARCH AND DATE FILTER -->
        

        <section class="task-controls" aria-label="Task filters">

            <input
                type="text"
                id="search-input"
                placeholder="Search tasks..."
                aria-label="Search tasks"
            >

            <select id="date-filter" aria-label="Filter tasks by date">
                <option value="all">All Dates</option>
                <option value="today">Today</option>
                <option value="week">This Week</option>
            </select>

        </section>


     <!-- TASK BOARD -->
    

        <section class="task-board" aria-label="Task board">

            <!-- To Start column -->
            <section class="task-column">
                <h3>
                    To Start
                    <span id="todo-count">0</span>
                </h3>

                <div class="task-list" id="todo-list">
                    <!-- Tasks are generated here using JavaScript -->
                </div>
            </section>


            <!-- In Progress column -->
            <section class="task-column">
                <h3>
                    In Progress
                    <span id="progress-count">0</span>
                </h3>

                <div class="task-list" id="in-progress-list">
                    <!-- Tasks are generated here using JavaScript -->
                </div>
            </section>


            <!-- Completed column -->
            <section class="task-column">
                <h3>
                    Completed
                    <span id="completed-count">0</span>
                </h3>

                <div class="task-list" id="completed-list">
                    <!-- Tasks are generated here using JavaScript -->
                </div>
            </section>

        </section>

    </main>

</body>
</html>
